<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StoryLoop film: Photo of my notes (11 seconds)</title>
<!--
  The second homepage film (18 Nov 2026): "Photo of my notes". One idea: notes
  written on paper are photographed, read into the note box for the educator to
  check, and become the story.

  Same rules as film.html: filmRender(t) draws the frame at second t, and
  render.mjs photographs it. What it shows is real: the handwritten note is a
  sample note from lib/real-examples.ts (an invented child), the story is
  exactly what the production writer wrote from that note, and every label is
  the app's own ("What happened?", "Photo of my notes", "Generate story", and
  the message the app shows after reading a photo). render.mjs passes them in
  as FILM_DATA. Nothing here claims a number or a time.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
  :root {
    --paper: #fbf8f2; --cream-50: #fefcf8; --cream-100: #fdf9ed; --cream-200: #faf0d4; --cream-300: #f5e4b1; --gold: #e8c155;
    --clay-50: #faf6f3; --clay-100: #f2ebe3; --clay-200: #e4d5c5; --clay-300: #d2b89e; --clay-500: #a87851; --clay-700: #6f4930; --clay-800: #543725; --clay-900: #3d281a;
    --ink-900: #0f0e0d; --ink-800: #1a1817; --ink-700: #2b2826; --ink-600: #3f3a38; --ink-500: #5a5350; --ink-300: #a39991; --ink-100: #e8e4de;
    --sage-50: #f2f6ee; --sage-100: #e1ebd6; --sage-200: #c7d8b3; --sage-600: #48652f; --sage-700: #3b5327; --sage-800: #304121;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  body { font-family: "Manrope", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #film {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background:
      radial-gradient(1200px 900px at 18% -10%, #fffdf7 0%, rgba(255,253,247,0) 60%),
      radial-gradient(1000px 900px at 105% 108%, #f3e7d6 0%, rgba(243,231,214,0) 62%),
      var(--paper);
  }
  .abs { position: absolute; will-change: transform, opacity; }

  #bar { left: 72px; right: 72px; top: 58px; height: 72px; display: flex; align-items: center; justify-content: space-between; }
  #brand { display: flex; align-items: center; gap: 18px; }
  #brand svg { width: 64px; height: 64px; }
  #brand span { font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 42px; color: var(--ink-900); letter-spacing: -0.01em; }
  #sample { font-weight: 700; font-size: 23px; color: var(--ink-500); border: 2px solid var(--clay-200); border-radius: 999px; padding: 9px 20px; background: rgba(255,255,255,0.6); }
  .label { font-weight: 800; font-size: 23px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--clay-700); }
  .touch { width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; background: rgba(15,14,13,0.16); border: 4px solid rgba(255,255,255,0.9); box-shadow: 0 8px 22px rgba(15,14,13,0.22); }

  /* ---- scene A: notes on paper, and the camera */
  #pad { left: 110px; top: 196px; width: 860px; height: 660px; transform-origin: 50% 50%; }
  .sheetPaper { position: absolute; inset: 0; border-radius: 10px; background-color: #fffef9;
    background-image: linear-gradient(90deg, rgba(0,0,0,0) 96px, #e8a39b 96px, #e8a39b 99px, rgba(0,0,0,0) 99px),
      repeating-linear-gradient(180deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) 73px, #c9d9ea 73px, #c9d9ea 75px);
    background-position: 0 0, 0 52px;
    box-shadow: 0 40px 80px -30px rgba(61,40,26,0.45), 0 4px 14px rgba(61,40,26,0.10); border: 1px solid #efe7da; }
  .holes { position: absolute; left: 34px; top: 70px; bottom: 70px; width: 26px; display: flex; flex-direction: column; justify-content: space-between; }
  .holes i { display: block; width: 26px; height: 26px; border-radius: 50%; background: #efe6d6; box-shadow: inset 0 2px 4px rgba(61,40,26,0.25); }
  .hand { position: absolute; left: 128px; right: 54px; top: 66px; font-family: "Caveat", cursive; font-weight: 600; font-size: 62px; line-height: 75px; color: #23324f; transform: rotate(-0.6deg); transform-origin: 0 0; }
  #shade { left: 0; top: 0; width: 1080px; height: 1350px; background: rgba(15,14,13,0.42); }
  #finder { left: 80px; top: 166px; width: 920px; height: 720px; }
  #finder i { position: absolute; width: 96px; height: 96px; border: 0 solid #fff; }
  #finder i:nth-child(1) { left: 0; top: 0; border-left-width: 9px; border-top-width: 9px; border-top-left-radius: 26px; }
  #finder i:nth-child(2) { right: 0; top: 0; border-right-width: 9px; border-top-width: 9px; border-top-right-radius: 26px; }
  #finder i:nth-child(3) { left: 0; bottom: 0; border-left-width: 9px; border-bottom-width: 9px; border-bottom-left-radius: 26px; }
  #finder i:nth-child(4) { right: 0; bottom: 0; border-right-width: 9px; border-bottom-width: 9px; border-bottom-right-radius: 26px; }
  #shutter { left: 470px; top: 930px; width: 140px; height: 140px; border-radius: 50%; border: 8px solid #fff; display: flex; align-items: center; justify-content: center; }
  #shutter b { display: block; width: 104px; height: 104px; border-radius: 50%; background: #fff; }
  #flash { left: 0; top: 0; width: 1080px; height: 1350px; background: #fff; }
  #photoBtn { left: 290px; top: 912px; width: 500px; height: 104px; border-radius: 52px; background: #fff; border: 3px solid var(--clay-200); color: var(--ink-700); font-weight: 800; font-size: 36px; display: flex; align-items: center; justify-content: center; gap: 16px; box-shadow: 0 22px 44px -18px rgba(84,55,37,0.35); }
  #photoBtn svg { width: 40px; height: 40px; }

  /* ---- scene B: read into the note box */
  #box { left: 90px; top: 250px; width: 900px; border-radius: 46px; background: #fff; border: 2px solid var(--clay-100); box-shadow: 0 40px 90px -30px rgba(111,73,48,0.34), 0 6px 18px rgba(111,73,48,0.06); padding: 50px 54px 46px; }
  #reading { position: absolute; left: 54px; top: 110px; display: flex; align-items: center; gap: 16px; font-weight: 700; font-size: 30px; color: var(--ink-500); }
  #reading svg { width: 34px; height: 34px; }
  #typed { margin-top: 26px; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 34px; line-height: 1.5; color: var(--ink-800); white-space: pre-wrap; }
  #msg { margin-top: 26px; border-radius: 22px; border: 2px solid var(--sage-200); background: var(--sage-50); padding: 18px 24px; font-weight: 700; font-size: 25px; line-height: 1.42; color: var(--sage-700); }
  #gen { left: 300px; width: 480px; height: 108px; border-radius: 54px; background: var(--clay-700); color: var(--paper); font-weight: 800; font-size: 38px; display: flex; align-items: center; justify-content: center; gap: 16px; box-shadow: 0 22px 44px -16px rgba(84,55,37,0.6); }
  #gen svg { width: 38px; height: 38px; }
  #thumb { left: 770px; top: 150px; width: 860px; height: 660px; transform-origin: 0 0; }

  /* ---- scene C: the story */
  #sheet { left: 70px; top: 176px; width: 940px; height: 892px; border-radius: 42px; background: #fffdf9; border: 2px solid var(--clay-100); box-shadow: 0 46px 100px -34px rgba(111,73,48,0.38), 0 6px 18px rgba(111,73,48,0.06); overflow: hidden; }
  #inner { position: absolute; left: 0; top: 0; width: 940px; padding: 56px 60px 80px; }
  #title { font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 66px; line-height: 1.08; color: var(--ink-900); letter-spacing: -0.015em; margin: 18px 0 26px; }
  .p { font-weight: 500; font-size: 33px; line-height: 1.56; color: var(--ink-700); margin: 0 0 26px; }
  .w { display: inline-block; white-space: pre; }
  .hl { background-image: linear-gradient(var(--cream-300), var(--cream-300)); background-repeat: no-repeat; background-position: 0 88%; background-size: 0% 62%; border-radius: 6px; color: var(--ink-900); font-weight: 700; padding: 0 4px; margin: 0 -4px; }
  #fadeBottom { left: 0; bottom: 0; width: 940px; height: 120px; pointer-events: none; background: linear-gradient(rgba(255,253,249,0), #fffdf9); }

  #cap, #cap2 { left: 72px; width: 936px; top: 1096px; height: 180px; display: flex; align-items: center; justify-content: center; text-align: center; font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 62px; line-height: 1.14; color: var(--ink-900); letter-spacing: -0.012em; text-wrap: balance; }
  #track { left: 72px; right: 72px; top: 1306px; height: 6px; border-radius: 3px; background: var(--clay-200); overflow: hidden; }
  #fill { width: 100%; height: 100%; background: var(--clay-700); transform-origin: 0 50%; }

  #end { left: 0; top: 0; width: 1080px; height: 1350px; background: radial-gradient(900px 800px at 50% 34%, #7d5539 0%, var(--clay-700) 55%, #5d3c27 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 96px 40px; }
  #end svg { width: 190px; height: 190px; filter: drop-shadow(0 24px 40px rgba(0,0,0,0.28)); }
  #endName { font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 104px; color: var(--paper); letter-spacing: -0.02em; margin-top: 34px; }
  #endLine { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 58px; line-height: 1.2; color: var(--cream-200); margin-top: 30px; text-wrap: balance; }
  #endSmall { font-weight: 700; font-size: 36px; color: var(--cream-200); opacity: 0.92; margin-top: 46px; letter-spacing: 0.01em; }

  #scrub { position: fixed; left: 12px; bottom: 12px; width: 420px; z-index: 9; }
  .render #scrub { display: none; }
</style>
</head>
<body>
<div id="film">
  <div id="bar" class="abs">
    <div id="brand">
      <svg viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="15" fill="#6f4930"/><path d="M 44.1 19.9 A 16 16 0 1 0 48 32" stroke="#fbf8f2" stroke-width="5" stroke-linecap="round"/><circle cx="46.5" cy="21.5" r="4.4" fill="#e8c155"/><circle cx="32" cy="32" r="3.2" fill="#fbf8f2"/></svg>
      <span>StoryLoop</span>
    </div>
    <div id="sample">Example from a sample note</div>
  </div>

  <div id="pad" class="abs"><div class="sheetPaper"></div><div class="holes"><i></i><i></i><i></i><i></i><i></i></div><div class="hand"></div></div>
  <div id="photoBtn" class="abs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
    Photo of my notes
  </div>
  <div id="shade" class="abs"></div>
  <div id="finder" class="abs"><i></i><i></i><i></i><i></i></div>
  <div id="shutter" class="abs"><b></b></div>

  <div id="box" class="abs">
    <div class="label">What happened?</div>
    <div id="reading"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Reading your notes…</div>
    <div id="typed"></div>
    <div id="msg"></div>
  </div>
  <div id="thumb" class="abs"></div>
  <div id="gen" class="abs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/></svg>
    Generate story
  </div>

  <div id="sheet" class="abs">
    <div id="inner"></div>
    <div id="fadeBottom" class="abs"></div>
  </div>

  <div id="flash" class="abs"></div>
  <div id="touch1" class="abs touch"></div>
  <div id="touch2" class="abs touch"></div>

  <div id="cap" class="abs"></div>

  <div id="track" class="abs"><div id="fill"></div></div>

  <div id="end" class="abs">
    <svg viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="15" fill="#fbf8f2"/><path d="M 44.1 19.9 A 16 16 0 1 0 48 32" stroke="#6f4930" stroke-width="5" stroke-linecap="round"/><circle cx="46.5" cy="21.5" r="4.4" fill="#e8c155"/><circle cx="32" cy="32" r="3.2" fill="#6f4930"/></svg>
    <div id="endName">StoryLoop</div>
    <div id="endLine">Photograph your notes. Get the story.</div>
    <div id="endSmall">Your written notes only, never children.</div>
  </div>
</div>
<input id="scrub" type="range" min="0" max="11" step="0.0333" value="5.2">

<script>
/* ------------------------------------------------------------------ data */
const FALLBACK = {
  note: "zara at the easel mixing blue and yellow with her fingers. said green! when it changed. covered the whole page then did her hands. showed Mia her hands.",
  story: "Mixing green at the easel\n\nLearning Story\nZara was at the easel using her fingers to mix blue and yellow paint. As the colours changed, Zara noticed what was happening and said, “green!”\n\nShe then covered the whole page with paint and moved the paint onto her hands as well.",
  // The app's own words after a photo is read (app/(app)/generate/page.tsx).
  message: "Notes added from your photo. Check them against the paper, especially anything a child said, then generate the story.",
};
const D = Object.assign({}, FALLBACK, window.FILM_DATA || {});
const DURATION = 11;

const clamp = (x) => Math.max(0, Math.min(1, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const $ = (id) => document.getElementById(id);
const set = (el, opacity, transform) => { el.style.opacity = opacity; if (transform !== undefined) el.style.transform = transform; };

const M = { words: [], lines: 1, hl: null, genTop: 900 };
function normalise(s) { return s.toLowerCase().replace(/[’‘]/g, "'").replace(/[“”]/g, '"').replace(/[^a-z0-9' ]+/g, " ").replace(/\s+/g, " ").trim(); }
function wordSpans(text, parent) {
  const out = [];
  for (const piece of text.split(/(\s+)/)) {
    if (!piece) continue;
    if (/^\s+$/.test(piece)) { parent.appendChild(document.createTextNode(" ")); continue; }
    const span = document.createElement("span");
    span.className = "w";
    span.textContent = piece;
    parent.appendChild(span);
    out.push(span);
  }
  return out;
}

function filmInit() {
  document.querySelector("#pad .hand").textContent = D.note;
  $("thumb").innerHTML = $("pad").innerHTML;
  $("msg").textContent = D.message;
  // The note box is as tall as its note: measure it full, then empty it.
  $("typed").textContent = D.note;
  $("typed").style.minHeight = $("typed").offsetHeight + "px";
  const boxH = $("box").offsetHeight;
  $("typed").textContent = "";
  M.genTop = Math.min(250 + boxH + 46, 940);
  $("gen").style.top = M.genTop + "px";

  // The story: its title and first paragraphs arrive a line at a time; the child's words are marked.
  const blocks = D.story.split(/\n\s*\n/).map((b) => b.trim()).filter(Boolean);
  const inner = $("inner");
  inner.innerHTML = "";
  const label = document.createElement("div");
  label.className = "label";
  label.textContent = "Your learning story";
  inner.appendChild(label);
  const title = document.createElement("div");
  title.id = "title";
  inner.appendChild(title);
  const words = [label, ...wordSpans(blocks[0], title)];
  const noteKey = normalise(D.note);
  for (const block of blocks.slice(1, 3)) {
    const body = block.replace(/^Learning Story\n/i, "").replace(/\n/g, " ");
    const p = document.createElement("p");
    p.className = "p";
    inner.appendChild(p);
    for (const part of body.split(/("[^"\n]{2,160}"|“[^”\n]{2,160}”)/g)) {
      if (!part) continue;
      const quoted = /^["“]/.test(part);
      if (quoted && !M.hl && noteKey.includes(normalise(part.slice(1, -1)))) {
        const hl = document.createElement("span");
        hl.className = "hl w";
        hl.textContent = part;
        p.appendChild(hl);
        M.hl = hl;
        words.push(hl);
      } else {
        words.push(...wordSpans(part, p));
      }
    }
  }
  const tops = [...new Set(words.map((el) => el.offsetTop))].sort((a, b) => a - b);
  M.words = words.map((el) => ({ el, line: tops.indexOf(el.offsetTop) }));
  M.lines = tops.length;
  document.body.classList.toggle("render", Boolean(window.FILM_RENDER));
  filmRender(Number($("scrub").value));
}

/* ------------------------------------------------------------------ timing (seconds) */
const T = {
  padIn: [0, 0.5], btn: 0.55, thumb: [0.75, 1.15], press: 1.2, finder: [1.45, 2.05], snap: 2.45,
  toThumb: [2.75, 3.45], boxIn: [2.9, 3.5], reading: [3.0, 3.7], type: [3.65, 4.6], msg: 4.65, gen: 4.9,
  thumb2: [5.45, 5.85], press2: 5.9, out: [6.1, 6.6], sheetIn: [6.25, 6.95], lines: 6.9, mark: [8.1, 8.75],
  end: [9.15, 9.85],
};
const CAPTIONS = [
  [0.05, 2.65, "Notes on paper?"],
  [2.8, 6.05, "Read into your note, for you to check."],
  [6.2, 9.1, "Then the story, from your note."],
];
function caption(el, t, row) {
  if (!row) { set(el, 0); return; }
  const [a, b, text] = row;
  const inP = eo(seg(t, a, a + 0.32));
  const outP = eio(seg(t, b - 0.24, b));
  if (el.textContent !== text) el.textContent = text;
  set(el, inP * (1 - outP), `translateY(${lerp(22, 0, inP) - 14 * outP}px)`);
}

function filmRender(t) {
  t = Math.max(0, Math.min(DURATION, t));

  // ---- scene A: the page of notes, the app's button, the camera.
  const padIn = eo(seg(t, T.padIn[0], T.padIn[1]));
  const press = seg(t, T.press, T.press + 0.1) - seg(t, T.press + 0.16, T.press + 0.32);
  const fIn = eio(seg(t, T.finder[0], T.finder[1]));
  const snap = seg(t, T.snap, T.snap + 0.08) - seg(t, T.snap + 0.1, T.snap + 0.3);
  const toThumb = eio(seg(t, T.toThumb[0], T.toThumb[1]));
  set($("pad"), padIn * (1 - seg(t, T.toThumb[0], T.toThumb[0] + 0.3)), `translateY(${lerp(40, 0, padIn)}px) rotate(${lerp(-1.6, -2.4, fIn)}deg) scale(${(lerp(0.97, 1, padIn) - 0.012 * snap) * lerp(1, 0.6, toThumb)})`);
  const btnIn = back(seg(t, T.btn, T.btn + 0.45));
  set($("photoBtn"), clamp(seg(t, T.btn, T.btn + 0.2)) * (1 - fIn), `translateY(${lerp(30, 0, clamp(btnIn))}px) scale(${lerp(0.9, 1, btnIn) - 0.045 * press})`);
  const th = eio(seg(t, T.thumb[0], T.thumb[1]));
  const t1 = $("touch1");
  t1.style.left = lerp(780, 560, th) + "px";
  t1.style.top = lerp(1240, 970, th) + "px";
  set(t1, seg(t, T.thumb[0], T.thumb[0] + 0.15) * (1 - seg(t, T.press + 0.2, T.press + 0.45)), `scale(${1 - 0.16 * press})`);
  const camOut = seg(t, T.snap + 0.25, T.snap + 0.5);
  set($("shade"), 0.9 * fIn * (1 - camOut));
  set($("finder"), fIn * (1 - camOut), `scale(${lerp(1.08, 1, fIn)})`);
  set($("shutter"), fIn * (1 - camOut), `scale(${lerp(0.7, 1, eo(fIn)) - 0.08 * snap})`);
  $("flash").style.opacity = 0.9 * (seg(t, T.snap, T.snap + 0.05) - seg(t, T.snap + 0.08, T.snap + 0.45));

  // ---- scene B: read into the note box, with the photo tucked in the corner.
  const boxIn = eo(seg(t, T.boxIn[0], T.boxIn[1]));
  const out = eio(seg(t, T.out[0], T.out[1]));
  set($("box"), boxIn * (1 - out), `translateY(${lerp(80, 0, boxIn) - 120 * out}px)`);
  const tIn = eo(seg(t, T.toThumb[0] + 0.15, T.toThumb[1]));
  set($("thumb"), tIn * (1 - out), `translateY(${lerp(60, 0, tIn) - 300 * out}px) rotate(7deg) scale(0.3)`);
  const reading = seg(t, T.reading[0], T.reading[0] + 0.2) * (1 - seg(t, T.reading[1] - 0.1, T.reading[1]));
  $("reading").style.opacity = reading;
  $("reading").querySelector("svg").style.transform = `rotate(${t * 400}deg)`;
  const chars = Math.round(D.note.length * eio(seg(t, T.type[0], T.type[1])));
  $("typed").textContent = D.note.slice(0, chars);
  const msg = eo(seg(t, T.msg, T.msg + 0.35));
  set($("msg"), msg, `translateY(${lerp(16, 0, msg)}px)`);
  const genIn = back(seg(t, T.gen, T.gen + 0.45));
  const press2 = seg(t, T.press2, T.press2 + 0.1) - seg(t, T.press2 + 0.16, T.press2 + 0.32);
  set($("gen"), clamp(seg(t, T.gen, T.gen + 0.2)) * (1 - out), `translateY(${lerp(30, 0, clamp(genIn)) - 120 * out}px) scale(${lerp(0.9, 1, genIn) - 0.045 * press2})`);
  const th2 = eio(seg(t, T.thumb2[0], T.thumb2[1]));
  const t2 = $("touch2");
  t2.style.left = lerp(800, 560, th2) + "px";
  t2.style.top = lerp(M.genTop + 330, M.genTop + 62, th2) + "px";
  set(t2, seg(t, T.thumb2[0], T.thumb2[0] + 0.15) * (1 - seg(t, T.press2 + 0.2, T.press2 + 0.45)), `scale(${1 - 0.16 * press2})`);

  // ---- scene C: the story, a line at a time, the child's words marked.
  const sIn = eo(seg(t, T.sheetIn[0], T.sheetIn[1]));
  const endOut = seg(t, T.end[0], T.end[0] + 0.4);
  set($("sheet"), sIn * (1 - endOut), `translateY(${lerp(140, 0, sIn)}px) scale(${lerp(0.96, 1, sIn)})`);
  for (const { el, line } of M.words) {
    const p = eo(seg(t, T.lines + line * 0.09, T.lines + 0.45 + line * 0.09));
    el.style.opacity = p;
    el.style.transform = `translateY(${(1 - p) * 16}px)`;
  }
  if (M.hl) M.hl.style.backgroundSize = `${eio(seg(t, T.mark[0], T.mark[1])) * 100}% 62%`;

  // ---- captions and progress
  const live = CAPTIONS.filter(([a, b]) => t >= a && t <= b);
  caption($("cap"), t, live[0]);
  caption($("cap2"), t, live[1]);
  $("fill").style.transform = `scaleX(${t / DURATION})`;

  // ---- the end card opens from the logo's gold dot, as in the first film.
  const open = eio(seg(t, T.end[0], T.end[1]));
  const end = $("end");
  end.style.clipPath = `circle(${open * 1750}px at 118px 86px)`;
  end.style.opacity = open > 0 ? 1 : 0;
  const e0 = T.end[0] + 0.4;
  const mark = back(seg(t, e0, e0 + 0.6));
  end.querySelector("svg").style.transform = `scale(${lerp(0.6, 1, mark)})`;
  end.querySelector("svg").style.opacity = clamp(seg(t, e0, e0 + 0.25));
  const n = eo(seg(t, e0 + 0.2, e0 + 0.75));
  set($("endName"), n, `translateY(${lerp(26, 0, n)}px)`);
  const l = eo(seg(t, e0 + 0.42, e0 + 1.0));
  set($("endLine"), l, `translateY(${lerp(26, 0, l)}px)`);
  const sm = eo(seg(t, e0 + 0.75, e0 + 1.3));
  $("endSmall").style.opacity = 0.92 * sm;
  $("endSmall").style.transform = `translateY(${lerp(20, 0, sm)}px)`;
  set($("bar"), 1 - seg(t, T.end[0], T.end[0] + 0.2));
  set($("track"), 1 - 0.75 * seg(t, T.end[0], T.end[0] + 0.6));
}

window.FILM_SECONDS = DURATION;
window.filmInit = filmInit;
window.filmRender = filmRender;
$("scrub").addEventListener("input", (e) => filmRender(Number(e.target.value)));
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { if (!window.FILM_RENDER) filmInit(); });
</script>
</body>
</html>
