<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StoryLoop film (20 seconds)</title>
<!--
  The homepage film, as a page. Nothing here plays by itself: filmRender(t)
  draws the frame at second t, so render.mjs can photograph 600 frames and
  encode.swift can turn them into an MP4. Open the file in a browser to scrub
  it with the slider.

  What it shows is real: the note and the story come from the same example the
  homepage demo plays (lib/demo-examples.ts, components/landing/StoryDemo.tsx),
  word for word, and the "flagged for you to check" lines are the ones the
  writer returned with that story. render.mjs passes them in as FILM_DATA.
  The only invented words are the family's reply, which is about the child and
  is labelled with the rest as an example.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
  :root {
    --paper: #fbf8f2; --cream-50: #fefcf8; --cream-100: #fdf9ed; --cream-200: #faf0d4; --cream-300: #f5e4b1; --gold: #e8c155;
    --clay-50: #faf6f3; --clay-100: #f2ebe3; --clay-200: #e4d5c5; --clay-300: #d2b89e; --clay-500: #a87851; --clay-700: #6f4930; --clay-800: #543725; --clay-900: #3d281a;
    --ink-900: #0f0e0d; --ink-800: #1a1817; --ink-700: #2b2826; --ink-600: #3f3a38; --ink-500: #5a5350; --ink-300: #a39991; --ink-100: #e8e4de;
    --sage-50: #f2f6ee; --sage-200: #c7d8b3; --sage-600: #48652f; --sage-800: #304121;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  body { font-family: "Manrope", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #film {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background:
      radial-gradient(1200px 900px at 18% -10%, #fffdf7 0%, rgba(255,253,247,0) 60%),
      radial-gradient(1000px 900px at 105% 108%, #f3e7d6 0%, rgba(243,231,214,0) 62%),
      var(--paper);
  }
  .abs { position: absolute; will-change: transform, opacity; }

  /* ---- top bar */
  #bar { left: 72px; right: 72px; top: 58px; height: 72px; display: flex; align-items: center; justify-content: space-between; }
  #brand { display: flex; align-items: center; gap: 18px; }
  #brand svg { width: 64px; height: 64px; }
  #brand span { font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 42px; color: var(--ink-900); letter-spacing: -0.01em; }
  #sample { font-weight: 700; font-size: 23px; color: var(--ink-500); border: 2px solid var(--clay-200); border-radius: 999px; padding: 9px 20px; background: rgba(255,255,255,0.6); }

  /* ---- scene A: the note */
  #note { left: 90px; top: 196px; width: 900px; height: 624px; border-radius: 46px; background: #fff; border: 2px solid var(--clay-100); box-shadow: 0 40px 90px -30px rgba(111,73,48,0.34), 0 6px 18px rgba(111,73,48,0.06); padding: 52px 56px; }
  .label { font-weight: 800; font-size: 23px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--clay-700); }
  #noteText { margin-top: 30px; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 34px; line-height: 1.52; color: var(--ink-800); white-space: pre-wrap; }
  #caret { display: inline-block; width: 4px; height: 40px; background: var(--clay-700); vertical-align: -7px; margin-left: 3px; border-radius: 2px; }
  #write { left: 280px; top: 862px; width: 520px; height: 112px; border-radius: 56px; background: var(--clay-700); color: var(--paper); font-weight: 800; font-size: 40px; display: flex; align-items: center; justify-content: center; gap: 16px; box-shadow: 0 22px 44px -16px rgba(84,55,37,0.6); }
  #write svg { width: 40px; height: 40px; }
  #ripple { left: 540px; top: 918px; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%; border: 6px solid var(--clay-700); }
  .touch { width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; background: rgba(15,14,13,0.16); border: 4px solid rgba(255,255,255,0.9); box-shadow: 0 8px 22px rgba(15,14,13,0.22); }

  /* ---- scenes C and D: the story sheet */
  #sheet { left: 70px; top: 176px; width: 940px; height: 892px; border-radius: 42px; background: #fffdf9; border: 2px solid var(--clay-100); box-shadow: 0 46px 100px -34px rgba(111,73,48,0.38), 0 6px 18px rgba(111,73,48,0.06); overflow: hidden; transform-origin: 50% 50%; }
  #inner { position: absolute; left: 0; top: 0; width: 940px; padding: 56px 60px 80px; will-change: transform; }
  #title { font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 66px; line-height: 1.08; color: var(--ink-900); letter-spacing: -0.015em; margin: 18px 0 26px; }
  .h { font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 38px; color: var(--ink-900); margin: 44px 0 14px; }
  .p { font-weight: 500; font-size: 33px; line-height: 1.56; color: var(--pcolor, #2b2826); margin: 0 0 26px; }
  .w { display: inline-block; white-space: pre; }
  .hl { background-image: linear-gradient(var(--cream-300), var(--cream-300)); background-repeat: no-repeat; background-position: 0 88%; background-size: 0% 62%; border-radius: 6px; color: var(--ink-900); font-weight: 700; padding: 0 4px; margin: 0 -4px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .lead { font-weight: 800; color: var(--sage-800); background-image: linear-gradient(var(--sage-200), var(--sage-200)); background-repeat: no-repeat; background-position: 0 92%; background-size: 0% 34%; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  #fadeTop, #fadeBottom { left: 0; width: 940px; height: 70px; pointer-events: none; }
  #fadeTop { top: 0; background: linear-gradient(#fffdf9, rgba(255,253,249,0)); }
  #fadeBottom { bottom: 0; background: linear-gradient(rgba(255,253,249,0), #fffdf9); }
  #tag { left: 0; right: 0; bottom: 44px; display: flex; justify-content: center; transform-origin: 50% 100%; }
  #tag span { background: var(--ink-900); color: var(--paper); font-weight: 800; font-size: 36px; padding: 20px 34px 20px 28px; border-radius: 999px; display: flex; align-items: center; gap: 16px; box-shadow: 0 22px 44px -12px rgba(15,14,13,0.55); }
  #tag i { width: 20px; height: 20px; border-radius: 50%; background: var(--gold); display: block; }
  .skel { left: 60px; height: 22px; border-radius: 11px; background: linear-gradient(90deg, var(--clay-100), var(--cream-200), var(--clay-100)); background-size: 200% 100%; }
  #checks { left: 40px; right: 40px; bottom: 40px; border-radius: 30px; background: #fffbeb; border: 2px solid #fde68a; padding: 34px 38px 30px; box-shadow: 0 -18px 50px -18px rgba(146,64,14,0.28); }
  #checks .label { color: #92400e; font-size: 24px; }
  #checks li { list-style: none; position: relative; padding-left: 42px; margin-top: 16px; font-weight: 600; font-size: 32px; line-height: 1.4; color: var(--ink-800); }
  #checks li::before { content: ""; position: absolute; left: 4px; top: 15px; width: 17px; height: 17px; border-radius: 50%; background: #d97706; }

  /* ---- scene E: the family */
  #phone { left: 500px; top: 236px; width: 510px; height: 790px; border-radius: 54px; background: #fff; border: 2px solid var(--clay-100); box-shadow: 0 46px 100px -34px rgba(111,73,48,0.42); padding: 46px 42px; overflow: hidden; }
  #phone .label { font-size: 20px; }
  #famTitle { font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 44px; line-height: 1.12; color: var(--ink-900); margin: 14px 0 26px; }
  #famCard { border-radius: 26px; border: 2px solid var(--clay-100); background: var(--cream-50); padding: 26px 28px 30px; }
  #famCard b { display: block; font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 34px; color: var(--ink-900); margin-bottom: 18px; }
  .barline { height: 14px; border-radius: 7px; background: var(--ink-100); margin-top: 14px; }
  #replyLabel { margin-top: 34px; font-weight: 800; font-size: 22px; color: var(--ink-600); }
  #reply { margin-top: 12px; min-height: 132px; border-radius: 24px; border: 2px solid var(--clay-200); background: #fff; padding: 22px 24px; font-weight: 600; font-size: 29px; line-height: 1.4; color: var(--ink-800); }
  #send { margin-top: 20px; height: 78px; border-radius: 39px; background: var(--clay-700); color: var(--paper); font-weight: 800; font-size: 30px; display: flex; align-items: center; justify-content: center; }
  #toast { left: 52px; top: 742px; background: var(--ink-900); color: var(--paper); border-radius: 26px; padding: 22px 26px 22px 24px; display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 28px; white-space: nowrap; box-shadow: 0 26px 50px -16px rgba(15,14,13,0.55); }
  #toast i { width: 22px; height: 22px; border-radius: 50%; background: var(--gold); display: block; flex: none; }

  /* ---- captions and progress */
  #cap, #cap2 { left: 72px; width: 936px; top: 1096px; height: 180px; display: flex; align-items: center; justify-content: center; text-align: center; font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 62px; line-height: 1.14; color: var(--ink-900); letter-spacing: -0.012em; text-wrap: balance; }
  #track { left: 72px; right: 72px; top: 1306px; height: 6px; border-radius: 3px; background: var(--clay-200); overflow: hidden; }
  #fill { width: 100%; height: 100%; background: var(--clay-700); transform-origin: 0 50%; }

  /* ---- scene F: end card */
  #end { left: 0; top: 0; width: 1080px; height: 1350px; background: radial-gradient(900px 800px at 50% 34%, #7d5539 0%, var(--clay-700) 55%, #5d3c27 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 96px 40px; }
  #end svg { width: 190px; height: 190px; filter: drop-shadow(0 24px 40px rgba(0,0,0,0.28)); }
  #endName { font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 104px; color: var(--paper); letter-spacing: -0.02em; margin-top: 34px; }
  #endLine { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 58px; line-height: 1.2; color: var(--cream-200); margin-top: 30px; text-wrap: balance; }
  #endSmall { font-weight: 700; font-size: 38px; color: var(--cream-200); opacity: 0.92; margin-top: 46px; letter-spacing: 0.01em; }

  /* scrubber, only when opened by hand */
  #scrub { position: fixed; left: 12px; bottom: 12px; width: 420px; z-index: 9; }
  .render #scrub { display: none; }
</style>
</head>
<body>
<div id="film">
  <div id="bar" class="abs">
    <div id="brand">
      <svg viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="15" fill="#6f4930"/><path d="M 44.1 19.9 A 16 16 0 1 0 48 32" stroke="#fbf8f2" stroke-width="5" stroke-linecap="round"/><circle cx="46.5" cy="21.5" r="4.4" fill="#e8c155"/><circle cx="32" cy="32" r="3.2" fill="#fbf8f2"/></svg>
      <span>StoryLoop</span>
    </div>
    <div id="sample">Example from a sample note</div>
  </div>

  <div id="note" class="abs">
    <div class="label">What happened?</div>
    <div id="noteText"></div>
  </div>
  <div id="write" class="abs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/></svg>
    Write my story
  </div>
  <div id="ripple" class="abs"></div>

  <div id="sheet" class="abs">
    <div id="inner"></div>
    <div id="fadeTop" class="abs"></div>
    <div id="fadeBottom" class="abs"></div>
    <div class="abs skel" id="sk1" style="top:74px;width:300px;height:34px"></div>
    <div class="abs skel" id="sk2" style="top:150px;width:820px"></div>
    <div class="abs skel" id="sk3" style="top:200px;width:760px"></div>
    <div class="abs skel" id="sk4" style="top:250px;width:560px"></div>
    <div id="tag" class="abs"><span><i></i>Exact words, kept</span></div>
    <div id="checks" class="abs"><div class="label">Flagged for you to check</div><ul id="checkList"></ul></div>
  </div>

  <div id="phone" class="abs">
    <div class="label">For the family</div>
    <div id="famTitle"></div>
    <div id="famCard"><b id="famStory"></b><div class="barline" style="width:100%"></div><div class="barline" style="width:92%"></div><div class="barline" style="width:64%"></div></div>
    <div id="replyLabel">Write back</div>
    <div id="reply"></div>
    <div id="send">Send</div>
  </div>
  <div id="toast" class="abs"><i></i><span id="toastText"></span></div>
  <div id="touch1" class="abs touch"></div>
  <div id="touch2" class="abs touch"></div>

  <div id="cap" class="abs"></div>
  <div id="cap2" class="abs"></div>
  <div id="track" class="abs"><div id="fill"></div></div>

  <div id="end" class="abs">
    <svg viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="15" fill="#fbf8f2"/><path d="M 44.1 19.9 A 16 16 0 1 0 48 32" stroke="#6f4930" stroke-width="5" stroke-linecap="round"/><circle cx="46.5" cy="21.5" r="4.4" fill="#e8c155"/><circle cx="32" cy="32" r="3.2" fill="#6f4930"/></svg>
    <div id="endName">StoryLoop</div>
    <div id="endLine">From a quick note to a story you would sign.</div>
    <div id="endSmall">Free to start. No card.</div>
  </div>
</div>
<input id="scrub" type="range" min="0" max="20" step="0.0333" value="10">

<script>
/* ------------------------------------------------------------------ data */
const FALLBACK = {
  child: "Tama",
  note: 'Tama at the sandpit, filled the red bucket with the scoop, tipped it out, did it again and again. Said "more sand" when it was empty. Carried it to the water trough and poured it in and watched it sink.',
  story: 'More sand\n\nLearning Story\nTama worked at the sandpit with the red bucket and scoop. He filled the bucket with sand, tipped it out, then filled it again.\n\nWhen the bucket was empty, Tama used his words to ask for what he wanted. He said, "more sand". This was a clear and useful message.\n\nCurriculum links\nMana aotūroa | Exploration: Tama used active exploration as he scooped, tipped, poured, and watched the sand in the water.\n\nMana reo | Communication: Tama used a short phrase to express what he wanted when the bucket was empty.',
  checks: ['Confirm whether the phrase "more sand" is exactly how Tama said it.', "No educator response was recorded, so the story only includes future ways we can support the learning."],
  reply: "He does this in the bath too! Thank you for noticing.",
};
const D = Object.assign({}, FALLBACK, window.FILM_DATA || {});
const DURATION = 20;

/* ------------------------------------------------------------------ maths */
const clamp = (x) => Math.max(0, Math.min(1, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const $ = (id) => document.getElementById(id);
const set = (el, opacity, transform) => { el.style.opacity = opacity; if (transform !== undefined) el.style.transform = transform; };

/* ------------------------------------------------------------------ build */
const M = { firstScreenWords: [], quoteTop: 0, linksTop: 0, leads: [], hl: null };

function wordSpans(text, parent) {
  // Words stay inline-block so each can rise on its own line; the quote keeps its own wrapper.
  const out = [];
  for (const piece of text.split(/(\s+)/)) {
    if (!piece) continue;
    if (/^\s+$/.test(piece)) { parent.appendChild(document.createTextNode(" ")); continue; }
    const span = document.createElement("span");
    span.className = "w";
    span.textContent = piece;
    parent.appendChild(span);
    out.push(span);
  }
  return out;
}

function normalise(s) { return s.toLowerCase().replace(/[’‘]/g, "'").replace(/[“”]/g, '"').replace(/[^a-z0-9' ]+/g, " ").replace(/\s+/g, " ").trim(); }

function filmInit() {
  const inner = $("inner");
  inner.innerHTML = "";
  const blocks = D.story.split(/\n\s*\n/).map((b) => b.trim()).filter(Boolean);
  const label = document.createElement("div");
  label.className = "label";
  label.textContent = "Your learning story";
  inner.appendChild(label);
  const title = document.createElement("div");
  title.id = "title";
  inner.appendChild(title);
  const first = [label, ...wordSpans(blocks[0], title)];
  const noteKey = normalise(D.note);
  let inLinks = false;
  let paragraphs = 0;
  for (const block of blocks.slice(1)) {
    const lines = block.split("\n");
    let body = block;
    if (lines.length > 1 && lines[0].length < 40 && !/[.!?]$/.test(lines[0])) {
      const heading = lines[0];
      inLinks = /curriculum|links/i.test(heading);
      if (!/^learning story$/i.test(heading)) {
        const h = document.createElement("div");
        h.className = "h";
        h.textContent = heading;
        inner.appendChild(h);
        if (inLinks) M.linksEl = h;
      }
      body = lines.slice(1).join(" ");
    }
    const p = document.createElement("p");
    p.className = "p";
    inner.appendChild(p);
    paragraphs += 1;
    if (inLinks && body.includes(":")) {
      const at = body.indexOf(":");
      const lead = document.createElement("span");
      lead.className = "lead";
      lead.textContent = body.slice(0, at + 1);
      p.appendChild(lead);
      p.appendChild(document.createTextNode(body.slice(at + 1)));
      M.leads.push(lead);
      continue;
    }
    // The first quote that is in the note word for word gets the highlight, as in the demo.
    const parts = body.split(/("[^"\n]{2,160}"|“[^”\n]{2,160}”)/g);
    for (const part of parts) {
      const quoted = /^["“]/.test(part);
      if (quoted && !M.hl && noteKey.includes(normalise(part.slice(1, -1)))) {
        const hl = document.createElement("span");
        hl.className = "hl";
        hl.textContent = part;
        p.appendChild(hl);
        M.hl = hl;
      } else if (paragraphs === 1) {
        first.push(...wordSpans(part, p));
      } else {
        p.appendChild(document.createTextNode(part));
      }
    }
    if (paragraphs > 1) { p.dataset.later = "1"; }
  }
  // Line numbers for the first screen, so it can arrive a line at a time.
  const tops = [...new Set(first.map((el) => el.offsetTop))].sort((a, b) => a - b);
  M.firstScreenWords = first.map((el) => ({ el, line: tops.indexOf(el.offsetTop) }));
  M.lines = tops.length;
  M.later = [...inner.querySelectorAll('[data-later], .h')];
  M.quoteTop = M.hl ? M.hl.offsetTop : 300;
  M.linksTop = M.linksEl ? M.linksEl.offsetTop : 600;

  // The note card is as tall as its note, and the card and button sit in the middle of the stage.
  const noteText = $("noteText");
  noteText.textContent = D.note;
  const cardH = Math.max(360, noteText.offsetHeight + 196);
  noteText.textContent = "";
  M.noteTop = Math.round(170 + (910 - (cardH + 44 + 112)) / 2);
  $("note").style.top = M.noteTop + "px";
  $("note").style.height = cardH + "px";
  M.btnTop = M.noteTop + cardH + 44;
  $("write").style.top = M.btnTop + "px";
  $("ripple").style.top = M.btnTop + 56 + "px";

  $("checkList").innerHTML = "";
  for (const c of D.checks.slice(0, 2)) { const li = document.createElement("li"); li.textContent = c; $("checkList").appendChild(li); }
  $("famTitle").textContent = D.child + "’s learning stories";
  $("famStory").textContent = blocks[0];
  $("toastText").textContent = D.child + "’s family wrote back";
  document.body.classList.toggle("render", Boolean(window.FILM_RENDER));
  filmRender(Number($("scrub").value));
}

/* ------------------------------------------------------------------ timing (seconds) */
const T = {
  type: [0.25, 2.65], button: 2.35, thumb: [2.75, 3.25], press: 3.3, noteOut: [3.7, 4.4],
  sheetIn: [4.0, 4.8], lines: 4.75, toQuote: [6.9, 8.0], mark: [8.1, 8.85], tag: [8.6, 10.05],
  toLinks: [10.05, 11.2], leads: 11.35, checks: [12.6, 13.2],
  side: [14.0, 14.8], phone: [14.15, 14.85], reply: [15.0, 15.85], thumb2: [15.55, 16.05], send: 16.1, toast: 16.3,
  end: [17.3, 18.05],
};
const CAPTIONS = [
  [0.05, 3.6, "A quick note, after play."],
  [3.75, 4.9, "One tap."],
  [5.05, 7.95, "A real draft, from your note."],
  [8.1, 10.0, "Children’s words, exactly as said."],
  [10.15, 12.45, "Curriculum links, only where your note supports them."],
  [12.6, 13.95, "And what to check before you share."],
  [14.1, 17.2, "Share it with the family. They can write back."],
];
function caption(el, t, row) {
  if (!row) { set(el, 0); return; }
  const [a, b, text] = row;
  const inP = eo(seg(t, a, a + 0.32));
  const outP = eio(seg(t, b - 0.24, b));
  if (el.textContent !== text) el.textContent = text;
  set(el, inP * (1 - outP), `translateY(${lerp(22, 0, inP) - 14 * outP}px)`);
}
const mix = (a, b, x) => "rgb(" + a.map((v, i) => Math.round(lerp(v, b[i], x))).join(",") + ")";

/* ------------------------------------------------------------------ one frame */
function filmRender(t) {
  t = Math.max(0, Math.min(DURATION, t));

  // ---- scene A: the note types itself, then a thumb presses the button.
  const chars = Math.round(D.note.length * eio(seg(t, T.type[0], T.type[1])));
  const caretOn = t < T.type[1] + 0.15 ? true : Math.floor(t * 2.4) % 2 === 0;
  $("noteText").innerHTML = "";
  $("noteText").appendChild(document.createTextNode(D.note.slice(0, chars)));
  if (caretOn) { const c = document.createElement("span"); c.id = "caret"; $("noteText").appendChild(c); }
  const aIn = eo(seg(t, 0, 0.45));
  const aOut = eio(seg(t, T.noteOut[0], T.noteOut[1]));
  set($("note"), aIn * (1 - aOut), `translateY(${lerp(40, 0, aIn) - 120 * aOut}px) scale(${lerp(0.97, 1, aIn) - 0.06 * aOut})`);
  const btnIn = back(seg(t, T.button, T.button + 0.5));
  const press = seg(t, T.press, T.press + 0.1) - seg(t, T.press + 0.16, T.press + 0.32);
  set($("write"), clamp(seg(t, T.button, T.button + 0.25)) * (1 - aOut), `translateY(${lerp(30, 0, clamp(btnIn)) - 120 * aOut}px) scale(${lerp(0.9, 1, btnIn) - 0.045 * press})`);
  const rip = seg(t, T.press + 0.08, T.press + 0.75);
  set($("ripple"), rip > 0 && rip < 1 ? 0.5 * (1 - rip) : 0, `scale(${lerp(0.5, 1.9, eo(rip))})`);
  const th = eio(seg(t, T.thumb[0], T.thumb[1]));
  const t1 = $("touch1");
  t1.style.left = lerp(760, 548, th) + "px";
  t1.style.top = lerp(M.btnTop + 330, M.btnTop + 64, th) + "px";
  set(t1, seg(t, T.thumb[0], T.thumb[0] + 0.2) * (1 - seg(t, T.press + 0.2, T.press + 0.5)), `scale(${1 - 0.16 * press})`);

  // ---- scenes B, C, D: the sheet rises, the first screen arrives by the line, then it reads down.
  const sIn = eo(seg(t, T.sheetIn[0], T.sheetIn[1]));
  const toSide = eio(seg(t, T.side[0], T.side[1]));
  const endOut = seg(t, T.end[0], T.end[0] + 0.4);
  set($("sheet"), sIn * (1 - endOut),
    `translate(${lerp(0, -246, toSide)}px, ${lerp(140, 0, sIn) + lerp(0, -84, toSide)}px) scale(${lerp(0.96, 1, sIn) * lerp(1, 0.5, toSide)}) rotate(${lerp(0, -4, toSide)}deg)`);
  // "Writing": three soft lines that shimmer until the words arrive.
  const skOut = seg(t, T.lines - 0.1, T.lines + 0.25);
  for (const id of ["sk1", "sk2", "sk3", "sk4"]) {
    $(id).style.opacity = seg(t, T.sheetIn[0] + 0.15, T.sheetIn[0] + 0.45) * (1 - skOut);
    $(id).style.backgroundPosition = `${-((t * 140) % 200)}% 0`;
  }
  for (const { el, line } of M.firstScreenWords) {
    const p = eo(seg(t, T.lines + line * 0.105, T.lines + 0.5 + line * 0.105));
    el.style.opacity = p;
    el.style.transform = `translateY(${(1 - p) * 16}px)`;
  }
  const laterIn = eo(seg(t, T.lines + 0.55 + M.lines * 0.105, T.lines + 1.25 + M.lines * 0.105));
  for (const el of M.later) el.style.opacity = laterIn;
  const toQuote = Math.max(0, M.quoteTop - 330);
  const toLinks = Math.max(toQuote, M.linksTop - 56);
  const scroll = lerp(0, toQuote, eio(seg(t, T.toQuote[0], T.toQuote[1]))) + lerp(0, toLinks - toQuote, eio(seg(t, T.toLinks[0], T.toLinks[1])));
  $("inner").style.transform = `translateY(${-scroll}px)`;
  set($("fadeTop"), clamp(scroll / 60));
  // The child's words take the light: everything else steps back while they are marked.
  const dim = eio(seg(t, T.mark[0] - 0.1, T.mark[0] + 0.5)) * (1 - eio(seg(t, T.tag[1] - 0.25, T.tag[1] + 0.25)));
  $("inner").style.setProperty("--pcolor", mix([43, 40, 38], [163, 153, 145], dim));
  if (M.hl) M.hl.style.backgroundSize = `${eio(seg(t, T.mark[0], T.mark[1])) * 100}% 62%`;
  const tagIn = back(seg(t, T.tag[0], T.tag[0] + 0.5));
  const tagOut = eio(seg(t, T.tag[1] - 0.3, T.tag[1]));
  set($("tag"), clamp(seg(t, T.tag[0], T.tag[0] + 0.2)) * (1 - tagOut), `translateY(${lerp(30, 0, clamp(tagIn)) + 20 * tagOut}px) scale(${lerp(0.8, 1, tagIn)})`);
  M.leads.forEach((lead, i) => { lead.style.backgroundSize = `${eio(seg(t, T.leads + i * 0.4, T.leads + 0.6 + i * 0.4)) * 100}% 34%`; });
  const chk = eo(seg(t, T.checks[0], T.checks[1]));
  set($("checks"), chk, `translateY(${lerp(120, 0, chk)}px)`);

  // ---- scene E: the family's phone, a reply, and the educator hears back.
  const ph = eo(seg(t, T.phone[0], T.phone[1]));
  set($("phone"), ph * (1 - endOut), `translateX(${lerp(220, 0, ph)}px) rotate(${lerp(6, 2, ph)}deg)`);
  $("reply").textContent = D.reply.slice(0, Math.round(D.reply.length * seg(t, T.reply[0], T.reply[1])));
  const sendPress = seg(t, T.send, T.send + 0.08) - seg(t, T.send + 0.12, T.send + 0.26);
  $("send").style.transform = `scale(${1 - 0.05 * sendPress})`;
  const t2 = $("touch2");
  const th2 = eio(seg(t, T.thumb2[0], T.thumb2[1]));
  t2.style.left = lerp(930, 762, th2) + "px";
  t2.style.top = lerp(1120, 944, th2) + "px";
  set(t2, seg(t, T.thumb2[0], T.thumb2[0] + 0.15) * (1 - seg(t, T.send + 0.2, T.send + 0.45)), `scale(${1 - 0.16 * sendPress})`);
  const toast = back(seg(t, T.toast, T.toast + 0.45));
  set($("toast"), clamp(seg(t, T.toast, T.toast + 0.18)) * (1 - endOut), `translateY(${lerp(40, 0, clamp(toast))}px) scale(${lerp(0.86, 1, toast)}) rotate(-2deg)`);

  // ---- captions: two layers so one can leave while the next arrives.
  const live = CAPTIONS.filter(([a, b]) => t >= a && t <= b);
  caption($("cap"), t, live[0]);
  caption($("cap2"), t, live[1]);
  $("fill").style.transform = `scaleX(${t / DURATION})`;

  // ---- scene F: the end card opens from the logo's gold dot.
  const open = eio(seg(t, T.end[0], T.end[1]));
  const end = $("end");
  end.style.clipPath = `circle(${open * 1750}px at 118px 86px)`;
  end.style.opacity = open > 0 ? 1 : 0;
  const e0 = T.end[0] + 0.4;
  const mark = back(seg(t, e0, e0 + 0.6));
  end.querySelector("svg").style.transform = `scale(${lerp(0.6, 1, mark)})`;
  end.querySelector("svg").style.opacity = clamp(seg(t, e0, e0 + 0.25));
  const n = eo(seg(t, e0 + 0.2, e0 + 0.75));
  set($("endName"), n, `translateY(${lerp(26, 0, n)}px)`);
  const l = eo(seg(t, e0 + 0.42, e0 + 1.0));
  set($("endLine"), l, `translateY(${lerp(26, 0, l)}px)`);
  const sm = eo(seg(t, e0 + 0.75, e0 + 1.3));
  $("endSmall").style.opacity = 0.92 * sm;
  $("endSmall").style.transform = `translateY(${lerp(20, 0, sm)}px)`;
  set($("bar"), 1 - seg(t, T.end[0], T.end[0] + 0.2));
  set($("track"), 1 - 0.75 * seg(t, T.end[0], T.end[0] + 0.6));
}

window.filmInit = filmInit;
window.filmRender = filmRender;
$("scrub").addEventListener("input", (e) => filmRender(Number(e.target.value)));
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { if (!window.FILM_RENDER) filmInit(); });
</script>
</body>
</html>
