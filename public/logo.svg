<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StoryLoop">
  <!-- Woven mark: two strands passing over and under each other, the smallest
       unit of a whāriki. Te Whāriki means "the woven mat". No ring, no arc:
       solid interlocking bars that stay legible at 16px. -->
  <defs>
    <clipPath id="slWeave"><rect x="208" y="240" width="96" height="96"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="#4A3226"/>
  <rect x="208" y="72" width="96" height="368" rx="48" fill="#FBF8F2"/>
  <rect x="72" y="208" width="368" height="96" rx="48" fill="#C08A5A"/>
  <g clip-path="url(#slWeave)"><rect x="208" y="72" width="96" height="368" rx="48" fill="#FBF8F2"/></g>
</svg>
