<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StoryLoop">
  <!-- Solid dark tile. The previous cream tile with a 2.5px hairline ring
       disappeared at favicon size; mass and contrast are what survive at 16px. -->
  <rect width="64" height="64" rx="15" fill="#4A3226"/>
  <!-- The cycle: notice, document, respond, notice again. Left open so it reads
       as a loop still turning rather than a closed ring. -->
  <path d="M32 14a18 18 0 1 1-16.5 11" fill="none" stroke="#FBF8F2" stroke-width="6.5" stroke-linecap="round"/>
  <!-- The child at the centre of it. -->
  <circle cx="32" cy="32" r="6" fill="#A87851"/>
</svg>
